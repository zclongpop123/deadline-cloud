map $request_uri $upstreamserver {
    default           deadline;
    ~transactionID.*  deadline2;
}

upstream deadline {
    server 172.20.0.6:8080;
}

upstream deadline2 {
    hash $binary_remote_addr$request_uri$args;
    server 172.20.0.6:8080;
}

server {
    listen 4433 ssl;
    server_name render.example.com;

    ssl_certificate     /etc/letsencrypt/live/deehii.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/deehii.com/privkey.pem;

    ssl_client_certificate    /etc/nginx/certs/ca.crt;
    ssl_crl                   /etc/nginx/certs/client.crl;
    ssl_verify_client         on;
    ssl_verify_depth          3;

    ssl_session_cache shared:SSL:10m;
    ssl_protocols  TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!eNULL:!EXPORT:!CAMELLIA:!DES:!MD5:!PSK:!RC4;
    ssl_prefer_server_ciphers on;

    client_max_body_size 20m;

    location / {
        proxy_set_header        Host $host;
        proxy_set_header        X-Real-IP $remote_addr;
        proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
	
        proxy_pass              http://$upstreamserver;
        proxy_read_timeout      90;
    }
}


upstream deadline_web_api {
    server 172.20.0.6:8081;
}

server {
    listen 4434 ssl;
    server_name render.example.com;

    ssl_certificate     /etc/letsencrypt/live/deehii.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/deehii.com/privkey.pem;

    ssl_session_cache builtin:1000 shared:SSL:10m;
    ssl_protocols  TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!eNULL:!EXPORT:!CAMELLIA:!DES:!MD5:!PSK:!RC4;
    ssl_prefer_server_ciphers on;

    client_max_body_size 5m;
    location / {
        proxy_set_header        Host $host;
        proxy_set_header        X-Real-IP $remote_addr;
        proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;

        proxy_pass              http://deadline_web_api;
        proxy_read_timeout      90;
    }
}
